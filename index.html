<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ECMWF OLR and VP200 tropical-wave forecast plots">
  <title>Tropical Wave Forecast Portal</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #07111f;
      --panel: rgba(15, 31, 50, 0.92);
      --panel-strong: #10243a;
      --border: rgba(148, 184, 220, 0.25);
      --text: #edf6ff;
      --muted: #9eb3c8;
      --accent: #45c8ff;
      --accent-2: #8d88ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #153b66 0, transparent 35%),
        radial-gradient(circle at 85% 20%, #302862 0, transparent 34%),
        var(--background);
    }
    header { padding: 38px 24px 22px; text-align: center; }
    header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      background: linear-gradient(90deg, #fff, #54ceff, #a69dff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header p { max-width: 760px; margin: 12px auto 0; color: var(--muted); }
    main { width: min(1500px, calc(100% - 32px)); margin: 0 auto 50px; }
    .controls, .layer-controls, .viewer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    select {
      width: 100%;
      padding: 11px 12px;
      color: var(--text);
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(69, 200, 255, 0.12); }
    .layer-controls { padding: 15px 20px 17px; margin-bottom: 16px; }
    .layer-controls[hidden] { display: none; }
    .layer-controls fieldset { padding: 0; margin: 0; border: 0; }
    .layer-controls legend {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #layer-options { display: flex; flex-wrap: wrap; gap: 9px; }
    .layer-option,
    .layer-action {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 7px 11px;
      color: var(--muted);
      background: rgba(7, 17, 31, 0.72);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font: inherit;
    }
    .layer-option:has(input:checked) {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(69, 200, 255, 0.13);
    }
    .layer-option input { margin: 0; accent-color: var(--accent); }
    .layer-action:hover,
    .layer-action:focus-visible {
      color: var(--text);
      border-color: var(--accent-2);
      outline: none;
    }
    .wave-key {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--wave-color, #d7e8f7);
    }
    .viewer { overflow: hidden; }
    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    #plot-title { margin: 0; font-size: 1rem; }
    .button {
      display: inline-block;
      padding: 9px 15px;
      color: #06111d;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 9px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .image-area {
      display: grid;
      min-height: 500px;
      padding: 14px;
      place-items: center;
      background: rgba(3, 10, 18, 0.65);
    }
    #plot-stack {
      --plot-aspect-number: 1;
      --plot-aspect-ratio: 1 / 1;
      position: relative;
      display: block;
      width: min(100%, calc(85vh * var(--plot-aspect-number)));
      aspect-ratio: var(--plot-aspect-ratio);
      max-width: 100%;
      max-height: 85vh;
      overflow: hidden;
    }
    .plot-layer {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: fill;
    }
    #message { color: var(--muted); text-align: center; }
    footer { padding: 0 20px 30px; color: var(--muted); text-align: center; font-size: 0.85rem; }
    @media (max-width: 950px) {
      .controls { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      main { width: min(100% - 18px, 1500px); }
      header { padding-top: 28px; }
      .controls { grid-template-columns: 1fr; }
      .viewer-header { align-items: flex-start; flex-direction: column; }
      .image-area { min-height: 300px; padding: 6px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tropical Wave Forecast Portal</h1>
    <p>Seasonal ECMWF OLR and VP200 Hovmöller forecasts along with tropical wave maps</p>
  </header>

  <main>
    <section class="controls" aria-label="Plot selection">
      <div><label class="field-label" for="year">Year</label><select id="year"></select></div>
      <div><label class="field-label" for="variable">Variable</label><select id="variable"></select></div>
      <div><label class="field-label" for="month">Initialization</label><select id="month"></select></div>
      <div><label class="field-label" for="plotType">Plot type</label><select id="plotType"></select></div>
      <div><label class="field-label" for="target">Forecast member</label><select id="target"></select></div>
    </section>

    <section id="layer-controls" class="layer-controls" hidden>
      <fieldset>
        <legend>Tropical-wave overlays — select any combination</legend>
        <div id="layer-options"></div>
      </fieldset>
    </section>

    <section class="viewer">
      <div class="viewer-header">
        <h2 id="plot-title">Loading plot catalogue…</h2>
        <a id="download" class="button" href="#" download>Download PNG</a>
      </div>
      <div class="image-area">
        <p id="message">Loading…</p>
        <div id="plot-stack" hidden></div>
      </div>
    </section>
  </main>

  <footer>Forecast products are updated monthly.</footer>

  <script>
    "use strict";

    const fields = ["year", "variable", "month", "plotType", "target"];
    const selectors = Object.fromEntries(
      fields.map((field) => [field, document.getElementById(field)])
    );
    const plotStack = document.getElementById("plot-stack");
    const message = document.getElementById("message");
    const plotTitle = document.getElementById("plot-title");
    const download = document.getElementById("download");
    const layerControls = document.getElementById("layer-controls");
    const layerOptions = document.getElementById("layer-options");

    const waveMetadata = {
      mjo:  { label: "MJO", color: "#111111" },
      er:   { label: "ER", color: "#ef4444" },
      cckw: { label: "CCKW", color: "#3282f6" },
      mrg:  { label: "MRG", color: "#22c55e" },
      low:  { label: "Low-frequency state", color: "#a020f0" }
    };

    // Compatibility for catalogue entries retained by an older GitHub Pages
    // deployment. The preferred fix remains publishing the current plots.json.
    const legacyImageAliases = {
      "Year 2026/OLR/2026-09 September/ensemble_mean/OLR_Hovmoller_ensemble_mean_20260101_20270403_20260915.png":
        "Year 2026/OLR/2026-09 September/ensemble_mean/OLR_Hovmoller_ensemble_mean_init202609_20260101_20270403_20260919_180107_403840.png"
    };

    let plots = [];
    let activeManifest = null;
    let activeManifestUrl = null;
    let renderSequence = 0;

    function unique(values) { return [...new Set(values)]; }

    function optionSort(field, values) {
      const sorted = [...values];
      if (field === "year" || field === "month") {
        return sorted.sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
      }
      if (field === "plotType") {
        const order = { "Hovmöller": 0, "Maps": 1 };
        return sorted.sort((a, b) => (order[a] ?? 99) - (order[b] ?? 99));
      }
      if (field === "target") {
        const rank = (value) => {
          if (value === "Ensemble Mean") return -2;
          if (value === "Control") return -1;
          const number = value.match(/\d+/);
          return number ? Number(number[0]) : 9999;
        };
        return sorted.sort((a, b) => rank(a) - rank(b));
      }
      return sorted.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    function matchingBefore(field) {
      const fieldIndex = fields.indexOf(field);
      return plots.filter((plot) =>
        fields.slice(0, fieldIndex).every(
          (previous) => plot[previous] === selectors[previous].value
        )
      );
    }

    function rebuildSelector(field) {
      const previousValue = selectors[field].value;
      const options = optionSort(field, unique(matchingBefore(field).map((plot) => plot[field])));
      selectors[field].replaceChildren();
      for (const value of options) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        selectors[field].appendChild(option);
      }
      if (options.includes(previousValue)) selectors[field].value = previousValue;
    }

    function rebuildAfter(changedField) {
      const startIndex = Math.max(0, fields.indexOf(changedField) + 1);
      for (let index = startIndex; index < fields.length; index += 1) {
        rebuildSelector(fields[index]);
      }
    }

    function selectedPlot() {
      return plots.find((plot) =>
        fields.every((field) => plot[field] === selectors[field].value)
      );
    }

    function resolveUrl(path, base = document.baseURI) { return new URL(path, base).href; }

    function plotImagePath(plot) {
      return legacyImageAliases[plot.image] || plot.image;
    }

    function plotManifestPath(plot) {
      const resolvedImage = plotImagePath(plot);

      // If an old image path was translated, its old layers path must also be
      // replaced by the same-stem directory belonging to the new image.
      if (resolvedImage !== plot.image) {
        return resolvedImage.replace(/\.png$/i, "/layers.json");
      }

      return plot.layers || resolvedImage.replace(/\.png$/i, "/layers.json");
    }

    function initializationCode(plot) {
      // Prefer explicit catalogue metadata. This is the stable format used by
      // the updated plots.json and works for every initialization month.
      const explicit = String(plot.initialization || "").replace(/\D/g, "");
      if (/^\d{6}$/.test(explicit)) return explicit;

      // Newer OLR/VP200 filenames include `_initYYYYMM_`.
      for (const path of [plotImagePath(plot), plot.layers || ""]) {
        const match = path.match(/(?:^|_)init(\d{6})(?:_|$)/i);
        if (match) return match[1];
      }

      // Legacy VP200 files (including the August set) do not contain `init`.
      // Their catalogue month remains authoritative, e.g. "2026-08 August".
      const monthMatch = String(plot.month || "").match(/(\d{4})-(\d{2})/);
      return monthMatch ? `${monthMatch[1]}${monthMatch[2]}` : null;
    }

    function initializationLabel(plot) {
      const code = initializationCode(plot);
      return code ? `Init ${code.slice(0, 4)}-${code.slice(4, 6)}` : null;
    }

    function createImage(source) {
      const image = document.createElement("img");
      image.className = "plot-layer";
      image.src = source;
      image.alt = "";
      image.decoding = "async";
      return image;
    }

    function setStackGeometry(width, height) {
      const canvasWidth = Number(width);
      const canvasHeight = Number(height);

      if (!(canvasWidth > 0 && canvasHeight > 0)) return false;

      plotStack.style.setProperty(
        "--plot-aspect-number",
        String(canvasWidth / canvasHeight)
      );
      plotStack.style.setProperty(
        "--plot-aspect-ratio",
        `${canvasWidth} / ${canvasHeight}`
      );
      return true;
    }

    function warnIfCanvasDiffers(image, width, height) {
      image.addEventListener("load", () => {
        if (image.naturalWidth !== Number(width) || image.naturalHeight !== Number(height)) {
          console.warn(
            "Layer canvas differs from layers.json:",
            image.src,
            `${image.naturalWidth}x${image.naturalHeight}`,
            "expected",
            `${width}x${height}`
          );
        }
      });
    }

    function displayComposite(plot) {
      activeManifest = null;
      activeManifestUrl = null;
      layerControls.hidden = true;
      layerOptions.replaceChildren();
      const imagePath = plotImagePath(plot);
      const image = createImage(resolveUrl(imagePath));
      image.alt = `${plot.variable} ${plot.plotType} ${plot.target}`;
      image.addEventListener("load", () => {
        setStackGeometry(image.naturalWidth, image.naturalHeight);
        plotStack.hidden = false;
        message.hidden = true;
      });
      image.addEventListener("error", () => {
        plotStack.hidden = true;
        message.hidden = false;
        message.textContent = `Image not found: ${imagePath}`;
      });
      plotStack.replaceChildren(image);
      plotStack.hidden = true;
    }

    function availableWaves(manifest) {
      return Object.keys(waveMetadata).filter((name) => manifest.layers?.[name]);
    }

    function addLayerToggle(value, label, color, checked = true) {
      const wrapper = document.createElement("label");
      wrapper.className = "layer-option";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = "wave-layer";
      checkbox.value = value;
      checkbox.checked = checked;
      const key = document.createElement("span");
      key.className = "wave-key";
      key.style.setProperty("--wave-color", color);
      const text = document.createElement("span");
      text.textContent = label;
      wrapper.append(checkbox, key, text);
      layerOptions.appendChild(wrapper);
    }

    function addLayerAction(action, label) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "layer-action";
      button.dataset.layerAction = action;
      button.textContent = label;
      layerOptions.appendChild(button);
    }

    function buildLayerToggles(manifest) {
      const waves = availableWaves(manifest);
      layerOptions.replaceChildren();
      addLayerAction("none", "Background only");
      addLayerAction("all", "All waves");
      for (const wave of waves) {
        const metadata = waveMetadata[wave];
        addLayerToggle(wave, metadata.label, metadata.color, true);
      }
      layerControls.hidden = waves.length === 0;
    }

    function renderLayerChoice() {
      if (!activeManifest || !activeManifestUrl) return;
      const selectedWaves = new Set(
        [...layerOptions.querySelectorAll('input[name="wave-layer"]:checked')]
          .map((input) => input.value)
      );
      const manifestDirectory = new URL(".", activeManifestUrl);
      const background = activeManifest.layers?.background;
      if (!background) return;
      const images = [createImage(resolveUrl(background, manifestDirectory))];
      images[0].alt = "Forecast plot background";

      const canvasWidth = Number(activeManifest.canvas?.width_px);
      const canvasHeight = Number(activeManifest.canvas?.height_px);
      const hasCanvasGeometry = setStackGeometry(canvasWidth, canvasHeight);

      if (hasCanvasGeometry) {
        warnIfCanvasDiffers(images[0], canvasWidth, canvasHeight);
      } else {
        images[0].addEventListener("load", () => {
          setStackGeometry(images[0].naturalWidth, images[0].naturalHeight);
        });
      }

      const waves = availableWaves(activeManifest);
      const visibleWaves = waves.filter((wave) => selectedWaves.has(wave));
      for (const wave of visibleWaves) {
        const overlay = createImage(
          resolveUrl(activeManifest.layers[wave], manifestDirectory)
        );
        if (hasCanvasGeometry) {
          warnIfCanvasDiffers(overlay, canvasWidth, canvasHeight);
        }
        images.push(overlay);
      }
      plotStack.replaceChildren(...images);
      plotStack.hidden = false;
      message.hidden = true;
    }

    async function loadInteractiveLayers(plot, sequence) {
      const manifestPath = plotManifestPath(plot);
      const manifestUrl = resolveUrl(manifestPath);
      try {
        const response = await fetch(manifestUrl, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const manifest = await response.json();
        if (sequence !== renderSequence) return;
        if (!manifest.layers?.background) throw new Error("Missing background layer");
        activeManifest = manifest;
        activeManifestUrl = manifestUrl;
        buildLayerToggles(manifest);
        renderLayerChoice();
      } catch (error) {
        if (sequence === renderSequence) displayComposite(plot);
      }
    }

    function renderPlot() {
      const plot = selectedPlot();
      renderSequence += 1;
      const sequence = renderSequence;
      if (!plot) {
        plotStack.hidden = true;
        layerControls.hidden = true;
        message.hidden = false;
        message.textContent = "No matching plot was found.";
        plotTitle.textContent = "No plot available";
        download.removeAttribute("href");
        return;
      }
      plotTitle.textContent = [
        plot.variable,
        plot.plotType,
        plot.target,
        initializationLabel(plot) || plot.month
      ].join(" · ");
      const imagePath = plotImagePath(plot);
      download.href = resolveUrl(imagePath);
      download.download = imagePath.split("/").pop();
      message.hidden = false;
      message.textContent = "Loading plot…";
      plotStack.hidden = true;
      layerControls.hidden = true;
      loadInteractiveLayers(plot, sequence);
    }

    for (const field of fields) {
      selectors[field].addEventListener("change", () => {
        rebuildAfter(field);
        renderPlot();
      });
    }
    layerOptions.addEventListener("change", renderLayerChoice);
    layerOptions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-layer-action]");
      if (!button) return;

      const enable = button.dataset.layerAction === "all";
      for (const checkbox of layerOptions.querySelectorAll('input[name="wave-layer"]')) {
        checkbox.checked = enable;
      }
      renderLayerChoice();
    });

    async function initialize() {
      try {
        const response = await fetch("plots.json?v=20260920-6", { cache: "reload" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const catalogue = await response.json();
        if (!Array.isArray(catalogue) || catalogue.length === 0) {
          throw new Error("plots.json contains no plot entries");
        }
        plots = catalogue;
        for (const field of fields) rebuildSelector(field);
        renderPlot();
      } catch (error) {
        plotTitle.textContent = "Unable to load plot catalogue";
        message.hidden = false;
        message.textContent = `Could not load plots.json: ${error.message}`;
        layerControls.hidden = true;
      }
    }

    initialize();
  </script>
</body>
</html>
